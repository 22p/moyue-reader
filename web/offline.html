<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>暂时无法连接 · 墨阅</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #fbf9f4;
    --ink: #262119;
    --muted: #7d7468;
    --line: #e2dbcd;
    --accent: #2f5d50;
    --accent-ink: #f6f3ea;
    --shadow: 0 24px 60px -30px rgba(38, 33, 25, .35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1b1e23;
      --ink: #ddd7ca;
      --muted: #948c7e;
      --line: #2b2f36;
      --accent: #8abdaa;
      --accent-ink: #10201b;
      --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 28px;
    background: var(--bg);
    background:
      radial-gradient(620px 420px at 50% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(420px, 100%);
    padding: 40px 36px 34px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--surface);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .mark {
    width: 60px;
    height: 60px;
    margin: 0 auto 24px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: var(--accent);
  }
  .mark svg {
    width: 28px;
    height: 28px;
    color: var(--accent-ink);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .eyebrow {
    display: block;
    margin-bottom: 10px;
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 14px;
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  p {
    margin: 0 0 26px;
    font-size: 13.5px;
    line-height: 1.95;
    color: var(--muted);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 46px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 14px;
    letter-spacing: .06em;
    text-decoration: none;
    transition: filter .2s, transform .15s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .hint {
    margin: 20px 0 0;
    font-size: 11px;
    line-height: 1.8;
    color: var(--muted);
    opacity: .8;
  }
  @media (max-width: 480px) {
    .card { padding: 34px 24px 28px; border-radius: 20px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/></svg>
    </div>
    <span class="eyebrow">Offline</span>
    <h1>暂时无法连接</h1>
    <p>墨阅服务没有响应。请检查网络连接，或确认服务器正在运行；恢复后再试一次即可继续阅读。</p>
    <a class="btn" href="/">重新加载</a>
    <p class="hint">已安装到桌面的墨阅会保留应用外壳，但书籍与阅读进度需要连接服务器。</p>
  </main>
</body>
</html>

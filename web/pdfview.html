<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 阅读</title>
<style>
  :root { --bg:#f7f4ec; --ink:#262119; --muted:#8a8175; --line:rgba(0,0,0,.08); }
  html, body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #stage { position:absolute; inset:16px; display:flex; align-items:center; justify-content:center; }
  #spread { width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:10px; }
  canvas { max-width:100%; max-height:100%; background:#fff; border-radius:2px;
           box-shadow:0 10px 34px rgba(20,18,12,.22), 0 1px 2px rgba(20,18,12,.18); }
  #status { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            color:var(--muted); font-size:13px; letter-spacing:.04em; text-align:center; line-height:1.8; }
  #indicator { position:absolute; right:16px; bottom:10px; font-size:11px; color:var(--muted);
               letter-spacing:.08em; opacity:.8; font-variant-numeric:tabular-nums; }
  @media (max-width: 640px) { #stage { inset:8px; } #spread { gap:6px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="spread">
    <canvas id="pdf-page" aria-label="PDF 页面"></canvas>
    <canvas id="pdf-page-2" aria-label="PDF 右页" hidden></canvas>
  </div>
  <div id="status">正在加载 PDF…</div>
</div>
<div id="indicator"></div>
<script src="/assets/pdfjs/pdf.min.js"></script>
<script src="/assets/pdfview.js"></script>
</body>
</html>
